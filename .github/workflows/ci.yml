name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys (for the formal cross-check)
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Build
        run: make
      - name: Test
        run: make test
